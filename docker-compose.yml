# Ejemplo de despliegue 1 — API + MongoDB en contenedores.
# Documentación: docs/deployment/01-docker-compose.md
#
#   cp .env.example .env      # y fija PORTAL_JWT_SECRET
#   docker compose up -d --build
#   docker compose run --rm seed        # usuarios y organizaciones iniciales
#   docker compose run --rm backfill    # carga del read model (necesita DSPACER_*)
#   open http://localhost:3000/docs
#
#   docker compose --profile monitoring up -d   # + Prometheus y Grafana
#   open http://localhost:3001                  # Grafana (admin/admin por defecto)
#
# Compose interpola las variables desde .env, así que si MONGODB_URI apunta a
# Atlas se usa ese valor y el contenedor de Mongo queda sin utilizar.

name: ondas-analytics

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
  MONGODB_DB: ${MONGODB_DB:-ondas_dataspace}
  PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?define PORTAL_JWT_SECRET en .env}
  PORTAL_JWT_EXPIRES_IN: ${PORTAL_JWT_EXPIRES_IN:-8h}
  # Conector del espacio de datos. Sin ellas el API arranca y sirve el modelo de
  # lectura que ya tenga, pero `backfill` y `POST /v1/sync/*` fallan: no hay
  # catálogo que leer. Se dejan vacías por defecto para que un despliegue de
  # evaluación levante sin credenciales.
  DSPACER_BASE_URL: ${DSPACER_BASE_URL:-}
  DSPACER_LOGIN_URL: ${DSPACER_LOGIN_URL:-}
  DSPACER_USER: ${DSPACER_USER:-}
  DSPACER_PASSWORD: ${DSPACER_PASSWORD:-}
  # Publica cada análisis generado en el catálogo compartido de producción.
  # Apagada salvo que se pida explícitamente.
  DSPACER_PUBLISH_ENABLED: ${DSPACER_PUBLISH_ENABLED:-false}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--quiet"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment: *api-env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Las gráficas generadas por /v1/analyses/run sobreviven al contenedor.
      - plots:/app/output/plots
    depends_on:
      mongo:
        condition: service_healthy

  # Servicios de un solo uso. `target: build` porque seed y backfill se ejecutan
  # con ts-node, que es dependencia de desarrollo y no está en la imagen final.
  seed:
    profiles: ["tools"]
    build:
      context: .
      target: build
    environment: *api-env
    command: ["npm", "run", "seed"]
    depends_on:
      mongo:
        condition: service_healthy

  backfill:
    profiles: ["tools"]
    build:
      context: .
      target: build
    environment: *api-env
    command: ["npm", "run", "backfill"]
    depends_on:
      mongo:
        condition: service_healthy

  # Perfil `monitoring`: no arranca con `docker compose up` a secas.
  #   docker compose --profile monitoring up -d
  # Documentación: docs/deployment/03-monitoring.md
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Sin `ports`: solo Grafana lo consulta, por la red interna de Compose.
    depends_on:
      - api

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      # Credenciales de evaluación local. En un despliegue accesible desde fuera
      # hay que cambiarlas y poner TLS por delante.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo-data:
  plots:
  prometheus-data:
  grafana-data:
